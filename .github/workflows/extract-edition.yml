name: Extract OSR edition

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to extract (details in editions.sources.yaml)"
        type: choice
        required: true
        options:
          - 2027-v2

permissions:
  contents: write
  pull-requests: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - name: Extract and generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITION: ${{ inputs.edition }}
          # Optional repository variables; defaults are in scripts/extract/settings.ts.
          OSR_MODEL_STRUCTURE: ${{ vars.OSR_MODEL_STRUCTURE }}
          OSR_EFFORT_STRUCTURE: ${{ vars.OSR_EFFORT_STRUCTURE }}
          OSR_MODEL_TEXT: ${{ vars.OSR_MODEL_TEXT }}
          OSR_EFFORT_TEXT: ${{ vars.OSR_EFFORT_TEXT }}
        run: npm run extract -- --edition "$EDITION" --summary-out "$RUNNER_TEMP/pr-body.md"
      - name: Test and build
        id: build
        continue-on-error: true
        run: npm test && npm run build
      - name: Note build failure in PR body
        if: steps.build.outcome == 'failure'
        run: |
          printf '\n## ⚠️ Build failed\n\nTests or the site build failed on this branch. See the workflow run: %s\n' \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$RUNNER_TEMP/pr-body.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: extract/${{ inputs.edition }}
          title: "OSR edition ${{ inputs.edition }}"
          commit-message: "content: extract OSR edition ${{ inputs.edition }}"
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: src/content/**
