id: crew-safety-harnesses
drawing: crew-safety-harnesses
rules:
  - 5.02.1
name:
  en: Deck safety harnesses
  de: Sicherheitsgurte für die Crew (Deck Safety Harnesses)
applies:
  osr2:
    section: bunks
    order: 130
    pages:
      - 23
    cardHash: sha256:85b40541daab55acc206993d39896196ec5bb62a72fe2942d03e7165a6814386
    sourceHash: sha256:f7ab4570452c85222c71e59fc724efc2f68c45a10b164d9df7d57dcaac227d95
    explanation:
      en: Each crewmember must have a deck safety harness. It must meet ISO 12401 or an equivalent standard; no size or rating beyond this is specified.
      de: Jedes Crewmitglied muss einen Deckssicherheitsgurt haben. Er muss ISO 12401 oder einer gleichwertigen Norm entsprechen; weitere Vorgaben zu Größe oder Einstufung sind nicht genannt.
