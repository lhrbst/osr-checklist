id: rudder-disabled-steering
drawing: rudder-disabled-steering
rules:
  - 4.15.2
name:
  en: Emergency steering with rudder disabled
  de: Notsteuerung bei Ruderausfall (Emergency Steering)
applies:
  osr2:
    section: demonstrate-use
    order: 90
    pages:
      - 17
    cardHash: sha256:af6ef41e72b70656d3c754c4d047a3608e5209ddb5e8a5678fd4495fd9512193
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: Have a backup method for steering the boat if the rudder is disabled. The method must be proven to work; this requirement specifies no particular equipment, quantity, or size.
      de: Es muss eine erprobte Möglichkeit geben, das Boot zu steuern, wenn das Ruder ausgefallen ist. Die Vorschrift nennt dafür weder eine bestimmte Ausrüstung noch eine Stückzahl oder Größe.
