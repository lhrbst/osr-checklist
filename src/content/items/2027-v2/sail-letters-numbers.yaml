name:
  en: Sail letters and numbers
  de: Segelzeichen und Segelnummern (Sail Letters and Numbers)
applies:
  osr2:
    section: general
    order: 210
    pages:
      - 16
    cardHash: sha256:49d8e843f2320805cf22ed45acb1f5f6b4923f69aee0c3f292f29f3117e616eb
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: Your sails must display the boat’s identification in accordance with RRS 77 and Appendix G. This requirement specifies no quantity or size beyond those rules.
      de: Die Segel müssen die Kennzeichnung des Bootes gemäß RRS 77 und Anhang G tragen. Diese Vorschrift nennt keine darüber hinausgehende Anzahl oder Größe.
