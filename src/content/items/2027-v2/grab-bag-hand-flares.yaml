    explanation:
      en: The boat must carry three hand flares. Stow them with a liferaft or in a grab bag; if using a grab bag, it must be accessible even when the boat is inverted.
      de: Das Boot muss drei Handfackeln mitführen. Sie müssen bei einer Rettungsinsel oder in einer Grab Bag verstaut sein; eine Grab Bag muss auch bei kieloben liegendem Boot zugänglich sein.
