id: liferaft-equipment-pack
drawing: liferaft-equipment-pack
rules:
  - 4.20.2
name:
  en: Liferaft equipment pack
  de: Ausrüstungspaket der Rettungsinsel (Liferaft Equipment Pack)
applies:
  osr2:
    section: on-deck
    order: 50
    pages:
      - 18
    cardHash: sha256:2077e49d9606f305ab299ababa571a758a650ba8d1ac25db35943db573cfc5b6
    sourceHash: sha256:bd83b542b85e09e29dc58aea1a7e3eb5c1e173530c7a35614da8c0a076c85a71
    explanation:
      en: The liferaft equipment pack is the emergency equipment carried in or alongside a liferaft. For OSR 2, a SOLAS raft must contain at least a SOLAS A pack; an ISO 9650 raft must contain at least Pack 2 (the less-than-24-hours pack). The listed ISO pack minimums include a hand-operated buoyant bailer, 2 sponges, a pair of handled paddles, a whistle, a signalling mirror, 6 seasickness tablets and 1 seasickness bag per person, 2 red parachute flares (one may be in a grab bag), a leak-repair kit usable when wet and in rough motion, and a hand pump ready to inflate most compartments; OSR 2 additionally requires a waterproof torch with 6-hour duration, a spare torch or spare battery and bulb, and 3 red hand flares. The tablets and bags may be in a readily accessible waterproof grab bag.
      de: Das Rettungsinsel-Ausrüstungspaket umfasst die Notausrüstung in oder bei der Rettungsinsel. Nach OSR 2 muss eine SOLAS-Insel mindestens ein SOLAS-A-Pack enthalten; eine ISO-9650-Insel mindestens Pack 2 für weniger als 24 Stunden. Zu den aufgeführten Mindestinhalten des ISO-Pakets gehören ein handbedienbarer schwimmfähiger Lenzer, 2 Schwämme, ein Paar Paddel mit Griffen, eine Pfeife, ein Signalspiegel, 6 Tabletten gegen Seekrankheit und 1 Seekrankheitsbeutel je Person, 2 rote Fallschirmraketen (eine darf im Grab Bag liegen), ein auch bei Nässe und Bewegung verwendbares Leckreparaturset sowie eine sofort einsatzbereite Handpumpe zum Aufpumpen der meisten Kammern; zusätzlich verlangt OSR 2 eine wasserdichte Lampe mit 6 Stunden Leuchtdauer, eine Ersatzlampe oder Ersatzbatterie und Birne sowie 3 rote Handfackeln. Tabletten und Beutel dürfen in einem leicht erreichbaren wasserdichten Grab Bag verstaut sein.
  osr3-liferaft:
