    explanation:
      en: The liferaft equipment pack is the emergency equipment carried in or alongside a liferaft. For OSR 3 + liferaft, a SOLAS raft must contain at least a SOLAS A pack; an ISO 9650 raft must contain at least Pack 2 (the less-than-24-hours pack). The listed ISO pack minimums include a hand-operated buoyant bailer, 2 sponges, a pair of handled paddles, a whistle, a signalling mirror, 6 seasickness tablets and 1 seasickness bag per person, 2 red parachute flares (one may be in a grab bag), a leak-repair kit usable when wet and in rough motion, and a hand pump ready to inflate most compartments; the category also requires a waterproof torch with 6-hour duration, a spare torch or spare battery and bulb, and 3 red hand flares. The tablets and bags may be in a readily accessible waterproof grab bag.
      de: Das Rettungsinsel-Ausrüstungspaket umfasst die Notausrüstung in oder bei der Rettungsinsel. Nach OSR 3 + liferaft muss eine SOLAS-Insel mindestens ein SOLAS-A-Pack enthalten; eine ISO-9650-Insel mindestens Pack 2 für weniger als 24 Stunden. Zu den aufgeführten Mindestinhalten des ISO-Pakets gehören ein handbedienbarer schwimmfähiger Lenzer, 2 Schwämme, ein Paar Paddel mit Griffen, eine Pfeife, ein Signalspiegel, 6 Tabletten gegen Seekrankheit und 1 Seekrankheitsbeutel je Person, 2 rote Fallschirmraketen (eine darf im Grab Bag liegen), ein auch bei Nässe und Bewegung verwendbares Leckreparaturset sowie eine sofort einsatzbereite Handpumpe zum Aufpumpen der meisten Kammern; außerdem sind eine wasserdichte Lampe mit 6 Stunden Leuchtdauer, eine Ersatzlampe oder Ersatzbatterie und Birne sowie 3 rote Handfackeln vorgeschrieben. Tabletten und Beutel dürfen in einem leicht erreichbaren wasserdichten Grab Bag verstaut sein.
