id: propulsion-engine
drawing: propulsion-engine
rules:
  - 3.28.1
name:
  en: Propulsion engine type
  de: Antriebsmotor und Bauart (Propulsion Engine)
applies:
  osr2:
    section: general
    order: 180
    pages:
      - 14
    cardHash: sha256:e32a94a4925165a8df5e43c73cc0c0d3e6074d2d8d517a88fc1cd24208f560b6
    sourceHash: sha256:16cb8a9ea3b4fd5c29578265a8522bcba17c08263e6b382e472298939e57de31
    explanation:
      en: The propulsion engine must be suitable for the boat’s size and intended use and provide at least 1.8 × √LWL knots when LWL is in metres, or √LWL knots when LWL is in feet. For the listed Mo0, Mo1, Mo2 and Mu0 classes, it must be an inboard engine.
      de: Der Antriebsmotor muss zur Größe und zum vorgesehenen Einsatz des Bootes passen und mindestens 1,8 × √LWL Knoten bei LWL in Metern beziehungsweise √LWL Knoten bei LWL in Fuß erreichen. Für die aufgeführten Klassen Mo0, Mo1, Mo2 und Mu0 ist ein Innenbordmotor vorgeschrieben.
  osr3:
    section: general
    order: 190
    pages:
      - 13
    cardHash: sha256:8327ab17456a7630d1e66ffb25eaf23a910c8c996d1b8b793c0428fefa9b85f4
    sourceHash: sha256:e9339fd413b8ff88c1f1d2a734b5f69d7edd1a7710c26994adb539805fa71c7f
    explanation:
      en: The propulsion engine must be suitable for the boat’s size and intended use and provide at least 1.8 × √LWL knots when LWL is in metres, or √LWL knots when LWL is in feet. For Mo3, either an inboard or outboard engine is allowed; the engine and its associated power-supply systems must be securely fastened.
      de: Der Antriebsmotor muss zur Größe und zum vorgesehenen Einsatz des Bootes passen und mindestens 1,8 × √LWL Knoten bei LWL in Metern beziehungsweise √LWL Knoten bei LWL in Fuß erreichen. Für Mo3 ist ein Innen- oder Außenbordmotor zulässig; Motor und zugehörige Stromversorgungssysteme müssen sicher befestigt sein.
  osr3-liferaft:
    section: general
    order: 190
    pages:
      - 13
    cardHash: sha256:8327ab17456a7630d1e66ffb25eaf23a910c8c996d1b8b793c0428fefa9b85f4
    sourceHash: sha256:e9339fd413b8ff88c1f1d2a734b5f69d7edd1a7710c26994adb539805fa71c7f
    explanation:
      en: The propulsion engine must be suitable for the boat’s size and intended use and provide at least 1.8 × √LWL knots when LWL is in metres, or √LWL knots when LWL is in feet. For Mo3, either an inboard or outboard engine is allowed; the engine and its associated power-supply systems must be securely fastened.
      de: Der Antriebsmotor muss zur Größe und zum vorgesehenen Einsatz des Bootes passen und mindestens 1,8 × √LWL Knoten bei LWL in Metern beziehungsweise √LWL Knoten bei LWL in Fuß erreichen. Für Mo3 ist ein Innen- oder Außenbordmotor zulässig; Motor und zugehörige Stromversorgungssysteme müssen sicher befestigt sein.
