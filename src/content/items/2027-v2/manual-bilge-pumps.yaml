id: manual-bilge-pumps
drawing: manual-bilge-pumps
rules:
  - 3.23.1
name:
  en: Manual bilge pumps
  de: Handlenzpumpen (Manual Bilge Pumps)
applies:
  osr2:
    section: general
    order: 120
    pages:
      - 13
    cardHash: sha256:69d5f43d5dfbb47c82d910f436dced9d243639c1d79bc80546b2f2185d1f87a9
    sourceHash: sha256:80e2c42d53f73f4e1645bda9e3b4f8027cf969770dc83c25ab4ae76ea65db72f
    explanation:
      en: For categories Mo0, Mo1 and Mo2, the boat must have two permanently installed manual bilge pumps. One must be operable from above deck and the other from below deck.
      de: In den Kategorien Mo0, Mo1 und Mo2 muss das Boot zwei fest eingebaute Handlenzpumpen haben. Eine muss von Deck aus und die andere von unter Deck bedienbar sein.
