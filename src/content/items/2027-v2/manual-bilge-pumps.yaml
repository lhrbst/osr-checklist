    explanation:
      en: For categories Mo3, Mu0, Mu1 and Mu2, the boat must have one permanently installed manual bilge pump.
      de: In den Kategorien Mo3, Mu0, Mu1 und Mu2 muss das Boot eine fest eingebaute Handlenzpumpe haben.
  osr3-liferaft:
