id: hatch-blocking-panels
drawing: hatch-blocking-panels
rules:
  - 3.08.4
name:
  en: Secured hatch blocking panels
  de: Gesicherte Steckschotten (Hatch Blocking Devices)
applies:
  osr2:
    section: on-deck
    order: 10
    pages:
      - 10
    cardHash: sha256:2da6effff83b057359806401dad8fe78d42a59574aa2d1a49ea342d49217e990
    sourceHash: sha256:83d451085168325e06daa68cb79ee17b2b24145ea5add9458525f849b965f398
    explanation:
      en: These are panels or other blocking devices for a companionway hatch. The hatch must have a strong securing arrangement operable from both outside and inside when the boat is inverted; blocking devices must stay in place with the hatch open or shut, be secured to the boat for the race, and allow escape if the boat inverts. No number or size is specified.
      de: Gemeint sind Platten oder andere Sperrvorrichtungen für die Niedergangsluke. Die Luke muss eine stabile Sicherung haben, die auch bei gekentertem Boot von innen und außen bedienbar ist; die Sperrvorrichtungen müssen bei offener oder geschlossener Luke in Position gehalten werden können, während des Rennens am Boot gesichert sein und bei einer Kenterung den Ausstieg ermöglichen. Anzahl oder Maße sind nicht festgelegt.
  osr3:
    section: on-deck
    order: 10
    pages:
      - 8
    cardHash: sha256:2da6effff83b057359806401dad8fe78d42a59574aa2d1a49ea342d49217e990
    sourceHash: sha256:e3f4bc78c3f9f35f118c899e4a708bb743fe2e7706d3251d67b8b86efb96be44
    explanation:
      en: These are blocking devices for a companionway hatch. The text provided requires the hatch to have a strong securing arrangement operable from outside and inside when the boat is inverted, and introduces blocking devices, but does not state further requirements for them or specify a number or size.
      de: Gemeint sind Sperrvorrichtungen für die Niedergangsluke. Der vorliegende Text verlangt für die Luke eine stabile Sicherung, die auch bei gekentertem Boot von innen und außen bedienbar ist, nennt Sperrvorrichtungen, enthält aber keine weiteren Anforderungen an sie und legt weder Anzahl noch Maße fest.
