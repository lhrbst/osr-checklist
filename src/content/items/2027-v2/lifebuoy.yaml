id: lifebuoy
drawing: lifebuoy
rules:
  - 4.22.3
name:
  en: Lifebuoy with light, whistle and drogue
  de: Rettungsring mit Licht, Pfeife und Treibanker (Lifebuoy)
applies:
  osr2:
    section: helm
    order: 40
    pages:
      - 20
    cardHash: sha256:0d7e22a243a0e395d1c4dc0e3581e779d6fa1004b323cb7ab5e66e2e458689ba
    sourceHash: sha256:47a4897c570a091b9eb2a520d90d99df380f0b77d2017921be9bdaedcaaab09d
    explanation:
      en: Carry one lifebuoy fitted with a self-igniting light, a whistle and a drogue. In addition, keep a second lifebuoy within the helmsman’s reach and ready for immediate use; it must have those same three fittings plus a pole and flag, with the pole permanently extended or able to extend fully automatically.
      de: Führen Sie einen Rettungsring mit selbstzündendem Licht, Signalpfeife und Treibanker mit. Zusätzlich muss ein zweiter, für den Rudergänger sofort griffbereiter Rettungsring mit denselben drei Ausrüstungsgegenständen sowie mit Stange und Flagge vorhanden sein; die Stange muss dauerhaft ausgefahren oder vollautomatisch ausfahrbar sein.
  osr3:
    section: helm
    order: 20
    pages:
      - 17
    cardHash: sha256:0d7e22a243a0e395d1c4dc0e3581e779d6fa1004b323cb7ab5e66e2e458689ba
    sourceHash: sha256:562d37b39a07d7b23740fb3a0f66cb0a89db7c8c1040780a5c2a96582e883908
    explanation:
      en: For MoMu 3 and 4, keep one lifebuoy fitted with a self-igniting light, a whistle and a drogue within the helmsman’s reach and ready for immediate use. The text gives no lifebuoy requirement for the other categories shown.
      de: Für MoMu 3 und 4 muss ein Rettungsring mit selbstzündendem Licht, Signalpfeife und Treibanker für den Rudergänger griffbereit und sofort einsatzbereit sein. Für die anderen aufgeführten Kategorien enthält der Text keine Rettungsring-Anforderung.
