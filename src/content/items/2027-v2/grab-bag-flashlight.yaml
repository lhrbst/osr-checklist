id: grab-bag-flashlight
drawing: grab-bag-flashlight
rules:
  - "4.07"
name:
  en: Grab-bag flashlight
  de: Taschenlampe in der Notfalltasche (Grab-bag Flashlight)
applies:
  osr2:
    section: grab-bag
    order: 20
    pages:
      - 16
    cardHash: sha256:8612339f32f136e77381c2203ea837be021633915934aca54cebc37afe4ecd03
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: Each grab bag must contain a flashlight. It must be watertight to at least IP67, provide at least 400 lumens, and have either spare batteries or rechargeable power; it must also have spare bulbs unless it uses LEDs.
      de: In jeder Grab Bag muss eine Taschenlampe mitgeführt werden. Sie muss mindestens Schutzart IP67 erfüllen und mindestens 400 Lumen liefern; außerdem braucht sie Ersatzbatterien oder einen Akku sowie Ersatzleuchtmittel, sofern sie keine LED-Lampe ist.
