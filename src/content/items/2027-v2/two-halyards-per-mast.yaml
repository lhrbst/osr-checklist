    explanation:
      en: Halyards are lines used to hoist sails. Each mast must have at least two, and each must be capable of hoisting a sail.
      de: Fallreeps sind Leinen zum Setzen von Segeln. Jeder Mast muss mindestens zwei davon haben, und jedes Fallreep muss ein Segel setzen können.
