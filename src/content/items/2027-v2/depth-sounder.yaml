    explanation:
      en: A depth sounder measures the water depth beneath the boat. Boats in MoMu categories 1, 2, 3 and 4 must carry one; no further specification is given.
      de: Ein Echolot misst die Wassertiefe unter dem Boot. Boote der Kategorien MoMu 1, 2, 3 und 4 müssen eines mitführen; weitere technische Vorgaben sind nicht genannt.
