    explanation:
      en: The boat must carry one knife, stowed either with a liferaft or in a grab bag. If it is in a grab bag, the bag must be accessible even when the boat is inverted.
      de: An Bord muss sich ein Messer befinden, das entweder bei einer Rettungsinsel oder in einer Grab Bag verstaut ist. Liegt es in der Grab Bag, muss diese auch bei gekentertem Boot zugänglich sein.
