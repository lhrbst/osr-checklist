id: radar-reflector
drawing: radar-reflector
rules:
  - 4.10.1
name:
  en: Radar reflector
  de: Radarreflektor (Radar Reflector)
applies:
  osr2:
    section: demonstrate-use
    order: 70
    pages:
      - 17
    cardHash: sha256:8bb932db878e6e51ca55b55d3303bea6c28bc2b698c311efc2949da5cdab127d
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: Carry one passive radar reflector. It must have octahedral circular plates at least 30 cm (12 in) in diameter, octahedral rectangular plates with a diagonal of at least 40 cm (16 in), or be a non-octahedral model documented to provide a minimum root-mean-square radar cross section of 2 m² (22 ft²) across 0–360° of azimuth and ±20° of heel.
      de: Führen Sie einen passiven Radarreflektor mit. Er muss entweder achteckige runde Platten mit mindestens 30 cm Durchmesser, achteckige rechteckige Platten mit mindestens 40 cm Diagonale oder als nicht-achteckiges Modell eine dokumentierte Radarreflexionsfläche (RMS) von mindestens 2 m² über 0–360° Azimut und ±20° Krängung aufweisen.
