  - 4.05.3
name:
  en: Two fire extinguishers
  de: Zwei Feuerlöscher (Fire Extinguishers)
applies:
  osr2:
    section: below-deck
    order: 180
    pages:
      - 16
    cardHash: sha256:1029527b876a8b695ed3d9d79a7f775bc2192c96ef758fdb177cf2054b060ac6
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: You must carry two fire extinguishers, each containing 2 kg of dry powder or an equivalent extinguishing agent. They must be stowed in different parts of the boat.
      de: An Bord müssen zwei Feuerlöscher mit jeweils 2 kg Löschpulver oder einem gleichwertigen Löschmittel sein. Sie müssen an unterschiedlichen Stellen im Boot untergebracht sein.
