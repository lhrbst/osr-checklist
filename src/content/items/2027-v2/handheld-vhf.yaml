    explanation:
      en: A Mo4 boat must carry a handheld marine VHF radio. It must be watertight or have a waterproof cover; this text does not specify a minimum output power or a quantity per grab bag.
      de: Ein Boot der Kategorie Mo4 muss ein tragbares UKW-Seefunkgerät mitführen. Es muss wasserdicht sein oder eine wasserdichte Schutzhülle besitzen; eine Mindest-Sendeleistung oder eine Anzahl pro Grab Bag ist hier nicht festgelegt.
