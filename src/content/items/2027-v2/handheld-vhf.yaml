id: handheld-vhf
drawing: handheld-vhf
rules:
  - 3.29.1
  - 3.29.2
name:
  en: Watertight handheld VHF
  de: Wasserdichtes UKW-Handfunkgerät (Hand-held Marine VHF Transceiver)
applies:
  osr2:
    section: grab-bag
    order: 10
    pages:
      - 15
    cardHash: sha256:0ce2e7444e003c9d453126639f3295b54c5a41b35435988e8c6d77ef99634cca
    sourceHash: sha256:75fc5e83b4abce3cee2a14583b094a9c3b3982645c5bb9b10f6bca226bc5423d
    explanation:
      en: The boat must carry a handheld marine VHF radio for each grab bag. Each radio must provide at least 5 W, be watertight or have a waterproof cover, and be kept in the grab bag when not in use.
      de: Für jede Grab Bag muss ein tragbares UKW-Seefunkgerät an Bord sein. Jedes Gerät muss mindestens 5 W Sendeleistung haben, wasserdicht sein oder eine wasserdichte Schutzhülle besitzen und bei Nichtgebrauch in der Grab Bag aufbewahrt werden.
