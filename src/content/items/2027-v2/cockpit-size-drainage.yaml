id: cockpit-size-drainage
drawing: cockpit-size-drainage
rules:
  - 3.09.1
name:
  en: Cockpit strength, size and drainage
  de: Cockpitfestigkeit, Größe und Entwässerung (Cockpit)
applies:
  osr2:
    section: general
    order: 70
    pages:
      - 10
    cardHash: sha256:53cdc4dc846362436eea8819e73b40346fc08677f2b89091a5a859a3e24c5a11
    sourceHash: sha256:83d451085168325e06daa68cb79ee17b2b24145ea5add9458525f849b965f398
    explanation:
      en: This item covers cockpit construction, height and volume. Cockpits must drain quickly by gravity at every angle of heel and be permanently built into the boat; the cockpit sole must be at least 2% of LWL above the waterline (or, for IMS boats first launched before 2003, 2% of L above it). Bow, lateral, central and stern wells count as cockpits; for boats in Mu/Mo categories 2, 3 and 4 with a series date before April 1992, the combined volume below the lowest coamings must not exceed 9% of LWL × maximum beam × freeboard abreast the cockpit.
      de: "Dieser Punkt betrifft Bau, Höhe und Volumen des Cockpits. Cockpits müssen bei jeder Krängung schnell durch Schwerkraft entwässern und dauerhaft in das Boot integriert sein; der Cockpitboden muss mindestens 2 % der LWL über der Wasserlinie liegen (bei IMS-Booten mit Erstwasserung vor 2003: 2 % der Länge L). Bug-, Seiten-, Mittel- und Heckmulden gelten ebenfalls als Cockpits; bei Booten der Kategorien Mu/Mo 2, 3 und 4 mit Serienbeginn vor April 1992 darf das Gesamtvolumen unter den niedrigsten Süllrändern höchstens 9 % aus LWL × größter Breite × Freibord neben dem Cockpit betragen."
  osr3:
    section: general
    order: 80
    pages:
      - 9
    cardHash: sha256:53cdc4dc846362436eea8819e73b40346fc08677f2b89091a5a859a3e24c5a11
    sourceHash: sha256:ca93f1b2a1dc2c12a803bd0d48fe91f16539f58c255b196dce82bb623a198311
    explanation:
      en: This item covers cockpit construction, height, volume and drainage. Cockpits must drain quickly by gravity at every angle of heel and be permanently built into the boat; the cockpit sole must be at least 2% of LWL above the waterline (or, for IMS boats first launched before 2003, 2% of L above it). Bow, lateral, central and stern wells count as cockpits; boats in Mu/Mo categories 2, 3 and 4 with a series date before April 1992 are limited to a combined cockpit volume of 9% of LWL × maximum beam × freeboard abreast the cockpit. Drain openings, measured unobstructed after any screens, must total at least the area of two 25 mm openings for boats under 8.5 m LH, or four 20 mm openings for boats 8.5 m LH or longer.
      de: "Dieser Punkt betrifft Bau, Höhe, Volumen und Entwässerung des Cockpits. Cockpits müssen bei jeder Krängung schnell durch Schwerkraft entwässern und dauerhaft in das Boot integriert sein; der Cockpitboden muss mindestens 2 % der LWL über der Wasserlinie liegen (bei IMS-Booten mit Erstwasserung vor 2003: 2 % der Länge L). Bug-, Seiten-, Mittel- und Heckmulden gelten als Cockpits; bei Booten der Kategorien Mu/Mo 2, 3 und 4 mit Serienbeginn vor April 1992 darf das Gesamtvolumen höchstens 9 % aus LWL × größter Breite × Freibord neben dem Cockpit betragen. Die freie Querschnittsfläche der Abläufe muss nach Abzug etwaiger Siebe mindestens zwei Öffnungen von 25 mm Durchmesser entsprechen, wenn LH unter 8,5 m liegt, beziehungsweise vier Öffnungen von 20 mm bei LH ab 8,5 m."
