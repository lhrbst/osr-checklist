id: keel-rudder-inspection
drawing: keel-rudder-inspection
rules:
  - 3.02.4
name:
  en: Keel and rudder inspection within two years
  de: Kiel- und Ruderprüfung innerhalb von zwei Jahren (Keel and Rudder Inspection)
applies:
  osr3:
    section: general
    order: 40
    pages:
      - 7
    cardHash: sha256:c5dfdfa30234cae768631a645863bd57323b3b3aeca28b77f0a8882fb286bda9
    sourceHash: sha256:5779776d8768c1976798c4be7e40c2b7ef803eb2f149b8be5133b366f6ce89f1
    explanation:
      en: This rule concerns checking the keel and rudder for structural integrity. At a haul-out within the two years before the event, the owner or their representative must inspect both, following the recommendations in Appendix L.
      de: Diese Regel betrifft die Kontrolle der strukturellen Unversehrtheit von Kiel und Ruder. Bei einem Krantermin innerhalb der zwei Jahre vor der Veranstaltung muss der Eigner oder eine von ihm beauftragte Person beide nach den Empfehlungen in Anhang L prüfen.
