id: fixed-dsc-vhf
drawing: fixed-dsc-vhf
rules:
  - 3.29.6
name:
  en: Fixed DSC VHF and masthead antenna
  de: UKW-DSC-Funkgerät mit Masttoppantenne (DSC VHF)
applies:
  osr2:
    section: below-deck
    order: 140
    pages:
      - 15
    cardHash: sha256:6aba9942a921a386c34ed7b857153c63f3f94ef4f12d276def1c4c721f5f3525
    sourceHash: sha256:75fc5e83b4abce3cee2a14583b094a9c3b3982645c5bb9b10f6bca226bc5423d
    explanation:
      en: The fixed marine VHF must have a rated output of at least 25 W; if installed after 2015, it must be DSC-capable. For MoMu0, MoMu1 and MoMu2, it must also use a masthead antenna at least 38 cm long and coaxial cable with no more than 40% power loss; no masthead-antenna specification is listed here for MoMu3.
      de: Das fest eingebaute UKW-Seefunkgerät muss eine Nennleistung von mindestens 25 W haben; bei einem Einbau nach 2015 muss es DSC-fähig sein. Für MoMu0, MoMu1 und MoMu2 ist außerdem eine mindestens 38 cm lange Mastantenne mit Koaxialkabel vorgeschrieben, das höchstens 40 % Leistungsverlust verursacht; für MoMu3 ist hier keine Mastantenne näher spezifiziert.
  osr3:
    section: below-deck
    order: 140
    pages:
      - 14
    cardHash: sha256:6aba9942a921a386c34ed7b857153c63f3f94ef4f12d276def1c4c721f5f3525
    sourceHash: sha256:15bded81fc188f0ab130762e90839bea3ac2c7035b70379e6440f3f058aeda25
    explanation:
      en: The fixed marine VHF must have a rated output of at least 25 W; if installed after 2015, it must be DSC-capable. For MoMu3, it must also have a masthead antenna and coaxial feeder cable with no more than 40% power loss; no antenna length is specified. The text lists no masthead-antenna requirement under this item for MoMu0, MoMu1 or MoMu2.
      de: Das fest eingebaute UKW-Seefunkgerät muss eine Nennleistung von mindestens 25 W haben; bei einem Einbau nach 2015 muss es DSC-fähig sein. Für MoMu3 sind außerdem eine Mastantenne und ein Koaxialkabel mit höchstens 40 % Leistungsverlust vorgeschrieben; eine Mindestlänge der Antenne ist nicht angegeben. Für MoMu0, MoMu1 und MoMu2 nennt dieser Punkt keine Mastantennenpflicht.
