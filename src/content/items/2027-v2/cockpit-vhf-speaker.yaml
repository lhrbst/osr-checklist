id: cockpit-vhf-speaker
drawing: cockpit-vhf-speaker
rules:
  - 3.29.6
name:
  en: External cockpit VHF speaker
  de: UKW-Außenlautsprecher im Cockpit (External VHF Speaker)
applies:
  osr2:
    section: general
    order: 200
    pages:
      - 15
    cardHash: sha256:e2382748b589145152c20df04c10eee9be94cfc63a7ff4572f45dc81221eac11
    sourceHash: sha256:75fc5e83b4abce3cee2a14583b094a9c3b3982645c5bb9b10f6bca226bc5423d
    explanation:
      en: An external cockpit VHF speaker lets the radio’s sound be heard in the cockpit. Boats in categories MoMu 1 and MoMu 2 must have one in the cockpit.
      de: Ein externer VHF-Lautsprecher im Cockpit macht den Funk dort hörbar. Boote der Kategorien MoMu 1 und MoMu 2 müssen einen solchen Lautsprecher im Cockpit haben.
  osr3:
    section: general
    order: 210
    pages:
      - 14
    cardHash: sha256:e2382748b589145152c20df04c10eee9be94cfc63a7ff4572f45dc81221eac11
    sourceHash: sha256:15bded81fc188f0ab130762e90839bea3ac2c7035b70379e6440f3f058aeda25
    explanation:
      en: An external cockpit VHF speaker lets the radio’s sound be heard in the cockpit. A MoMu 3 boat must have one in the cockpit if it has fewer than three crew members.
      de: Ein externer VHF-Lautsprecher im Cockpit macht den Funk dort hörbar. Ein Boot der Kategorie MoMu 3 muss einen solchen Lautsprecher im Cockpit haben, wenn weniger als drei Crewmitglieder an Bord sind.
