id: abandon-ship-drill
drawing: abandon-ship-drill
rules:
  - "6.04"
name:
  en: Abandon-ship drill
  de: Übung zum Verlassen des Schiffes (Abandon-ship Drill)
applies:
  osr2:
    section: chart-table
    order: 90
    pages:
      - 24
    cardHash: sha256:01599819d4934ab6a0c102c96a8d1cf5bb824e1b762b9b2b883c8431f669f931
    sourceHash: sha256:dc59275e185c763898712ad6c67a0059cbf4a868acc9355e295e6508f224a5e8
    explanation:
      en: An abandon-ship drill is practice for leaving the vessel in an emergency. The crew must practise this drill at least once each year; the rule specifies no crew number or other drill details.
      de: Bei einer Abandon-ship-Übung wird das Verlassen des Schiffs im Notfall geübt. Die Crew muss diese Übung mindestens einmal jährlich durchführen; eine bestimmte Zahl von Crewmitgliedern oder weitere Übungsdetails sind nicht festgelegt.
