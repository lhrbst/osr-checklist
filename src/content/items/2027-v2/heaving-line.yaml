id: heaving-line
drawing: heaving-line
rules:
  - 4.22.4
name:
  en: Heaving line
  de: Wurfleine (Heaving Line)
applies:
  osr2:
    section: helm
    order: 60
    pages:
      - 20
    cardHash: sha256:15470ffd856a25156468e8977ec7be6f2b1a984134c528d8044e8b0b9a24373a
    sourceHash: sha256:47a4897c570a091b9eb2a520d90d99df380f0b77d2017921be9bdaedcaaab09d
    explanation:
      en: A heaving line is a throwable line used to pass a line to someone or something. The boat must carry one at least 6 mm (1/4 inch) in diameter and 15–25 m (50–75 ft) long, readily accessible from the cockpit.
      de: Eine Wurfleine dient dazu, eine Leine zu einer Person oder einem Gegenstand hinüberzuwerfen. An Bord muss eine Wurfleine mit mindestens 6 mm Durchmesser und 15–25 m Länge vorhanden und vom Cockpit aus leicht erreichbar sein.
