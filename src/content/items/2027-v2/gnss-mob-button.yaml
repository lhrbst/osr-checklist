id: gnss-mob-button
drawing: gnss-mob-button
rules:
  - 4.22.2
name:
  en: GNSS MOB locating function
  de: MOB-Funktion am GNSS (MOB Button)
applies:
  osr2:
    section: helm
    order: 30
    pages:
      - 19
    cardHash: sha256:cec559b109db971ff63514bc8ce7d82fc20c36b921ba99f3c0205fda09a7f0b2
    sourceHash: sha256:41b43dfb746c4983958c2b9ae40cb4b42383b68acbc50faa6761853ea8ceb9f1
    explanation:
      en: The boat must carry a GNSS that can record a crew-overboard position within 10 seconds and display or otherwise monitor that position. If the boat has only two crewmembers, the position must be monitorable without going below deck.
      de: An Bord muss ein GNSS vorhanden sein, das die Position eines über Bord gegangenen Crewmitglieds innerhalb von 10 Sekunden speichert und die Überwachung dieser Position ermöglicht. Bei nur zwei Crewmitgliedern muss die Position überwacht werden können, ohne unter Deck zu gehen.
