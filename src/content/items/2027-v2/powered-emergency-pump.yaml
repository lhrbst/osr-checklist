id: powered-emergency-pump
drawing: powered-emergency-pump
rules:
  - "4.30"
name:
  en: Powered emergency pump
  de: Motorbetriebene Notlenzpumpe (Emergency Pump)
applies:
  osr2:
    section: general
    order: 260
    pages:
      - 22
    cardHash: sha256:514bf80e892d991106869173535dee12e293ae600bfb9a0d64fd0bc802ba3dd5
    sourceHash: sha256:84c509add9886fd997dacac1e866a0a4e6b0d9cc1ac75e7a6194649f301794aa
    explanation:
      en: The boat must have a fixed or portable powered emergency pump able to remove incoming water from any compartment, rated at least 200 l/min (3,200 US gal/h). It must be powered by a battery, the main engine or a separate engine; a portable electric pump must have cables ending in alligator clips or another secure connection. Its hose must be long enough to discharge directly overboard or into the cockpit, and fixed and portable pumps may be combined to meet the requirement.
      de: Das Boot muss eine fest eingebaute oder tragbare, angetriebene Notlenzpumpe haben, die eindringendes Wasser aus jedem Abteil entfernen kann und mindestens 200 l/min (3.200 US-gal/h) fördert. Die Pumpe muss mit einer Batterie, dem Hauptmotor oder einem separaten Motor betrieben werden; bei einer tragbaren Elektropumpe müssen die Kabel mit Krokodilklemmen oder einer anderen sicheren Verbindung versehen sein. Der Schlauch muss lang genug sein, um das Wasser direkt über Bord oder ins Cockpit zu leiten; fest eingebaute und tragbare Pumpen können zusammen die Anforderung erfüllen.
