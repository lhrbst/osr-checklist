id: seacocks-valves
drawing: seacocks-valves
rules:
  - "3.10"
name:
  en: Through-hull seacocks or valves
  de: Seeventile an Rumpfdurchlässen (Sea Cocks or Valves)
applies:
  osr2:
    section: below-deck
    order: 30
    pages:
      - 11
    cardHash: sha256:72a01d4d657bd0671b6efb2c5623004e1f035e5c5a5f30c6dea7999fcad28d5f
    sourceHash: sha256:aa2fe2b1ae0027daa31d1364bafa3337dd75d3c4bd54d622098aa05bcd1fef2f
    explanation:
      en: A seacock or valve is a shut-off fitting for a hull opening below the waterline. Fit a permanently installed seacock or valve to every such opening, except integral deck scuppers and instrument through-hulls; no quantity beyond one for each opening, size, or rating is specified.
      de: Ein Seeventil ist eine Absperrarmatur für eine Rumpfdurchführung unterhalb der Wasserlinie. Jede solche Öffnung muss dauerhaft mit einem Seeventil oder einer Absperrarmatur versehen sein; ausgenommen sind integrierte Deckslenzer und Instrumentendurchführungen. Weitere Vorgaben zu Größe oder Druckstufe nennt die Regel nicht.
