id: emergency-radio-antenna
drawing: emergency-radio-antenna
rules:
  - 3.29.5
name:
  en: Emergency radio antenna
  de: Notantenne für Funkgeräte (Emergency Radio Antenna)
applies:
  osr2:
    section: bunks
    order: 20
    pages:
      - 15
    cardHash: sha256:4cf1a1b43be37a80461b590b4d2339740cd2c1487b0ab3ba0d0f8d24a8abe338
    sourceHash: sha256:75fc5e83b4abce3cee2a14583b094a9c3b3982645c5bb9b10f6bca226bc5423d
    explanation:
      en: An emergency radio antenna is a backup antenna for the boat’s marine radio transceiver. It is required if the regular antenna depends on the mast; no size or rating is specified.
      de: Eine Notantenne ist eine Ersatzantenne für das Seefunkgerät an Bord. Sie ist vorgeschrieben, wenn die normale Antenne vom Mast abhängig ist; Größe oder Leistungsdaten sind nicht festgelegt.
