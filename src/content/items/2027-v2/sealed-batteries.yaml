id: sealed-batteries
drawing: sealed-batteries
rules:
  - 3.28.4
name:
  en: Sealed batteries
  de: Geschlossene Batterien (Sealed Batteries)
applies:
  osr2:
    section: below-deck
    order: 120
    pages:
      - 15
    cardHash: sha256:a82b449e26537786d94a69b14a07a1ffbdbae18b001ad5e561a4a1731a1dd0f9
    sourceHash: sha256:75fc5e83b4abce3cee2a14583b094a9c3b3982645c5bb9b10f6bca226bc5423d
    explanation:
      en: Batteries installed after 2011 must be sealed so that liquid electrolyte cannot escape. The rule specifies no number or battery size.
      de: Batterien, die nach 2011 eingebaut wurden, müssen geschlossen sein, sodass kein flüssiger Elektrolyt austreten kann. Eine Anzahl oder Batteriegröße ist nicht vorgegeben.
