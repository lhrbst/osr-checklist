id: second-lifebuoy-pole-flag
drawing: second-lifebuoy-pole-flag
rules:
  - 4.22.3
name:
  en: Second lifebuoy with pole and flag
  de: Zweiter Rettungsring mit Markierungsboje (Second Lifebuoy with Pole and Flag)
applies:
  osr2:
    section: helm
    order: 50
    pages:
      - 20
    cardHash: sha256:41ccb01e652ec17ba4d319a5d38ed07705c04a72b6e0f7b25fef834a18fc808d
    sourceHash: sha256:47a4897c570a091b9eb2a520d90d99df380f0b77d2017921be9bdaedcaaab09d
    explanation:
      en: "The boat must carry two lifebuoys: one with a self-igniting light, whistle and drogue, and a second one within reach of the helmsman and ready for immediate use. The second lifebuoy must also have a whistle, drogue and self-igniting light, plus a pole and flag; the pole must be permanently extended or extend fully automatically."
      de: "Das Boot muss zwei Rettungsringe mitführen: einen mit selbstzündendem Licht, Pfeife und Treibanker sowie einen zweiten, der für den Rudergänger griffbereit und sofort einsatzbereit ist. Der zweite Rettungsring muss ebenfalls Pfeife, Treibanker und selbstzündendes Licht haben sowie mit Stange und Flagge ausgestattet sein; die Stange muss dauerhaft ausgefahren oder vollautomatisch ausfahrbar sein."
