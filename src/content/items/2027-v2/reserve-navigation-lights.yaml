id: reserve-navigation-lights
drawing: reserve-navigation-lights
rules:
  - 3.27.3
name:
  en: Independently powered reserve lights
  de: Unabhängig versorgte Ersatzpositionslichter (Reserve Navigation Lights)
applies:
  osr2:
    section: demonstrate-use
    order: 20
    pages:
      - 14
    cardHash: sha256:c51da1f275f2b8eb23b3f86eb73e69b791990c4378c3712ffe6fac26b75e29e4
    sourceHash: sha256:16cb8a9ea3b4fd5c29578265a8522bcba17c08263e6b382e472298939e57de31
    explanation:
      en: "The boat must carry reserve navigation lights with the same specifications as its required navigation lights: they must comply with COLREG Part C and Technical Annex I, and be mounted above the sheerline where sails or heeling will not mask them. They must be capable of being powered independently; no number of reserve lights is specified here."
      de: "Das Boot muss Reserve-Navigationslichter mit denselben Anforderungen wie die vorgeschriebenen Navigationslichter mitführen: Sie müssen COLREG Teil C und Technischem Anhang I entsprechen und oberhalb der Deckskante so angebracht sein, dass Segel oder Krängung sie nicht verdecken. Sie müssen unabhängig mit Strom versorgt werden können; eine Anzahl ist hier nicht festgelegt."
