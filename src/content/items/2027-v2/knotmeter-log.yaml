id: knotmeter-log
drawing: knotmeter-log
rules:
  - 4.13.1
name:
  en: Knotmeter or log
  de: Fahrtmesser oder Logge (Knotmeter or Log)
applies:
  osr2:
    section: general
    order: 220
    pages:
      - 17
    cardHash: sha256:1a2a8ed69309cc3f12e04dca6486bb9449b90947baee4bc85f154597535116d1
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: A knotmeter measures the boat’s speed through the water; a log measures distance travelled. This category requires a knotmeter or a distance-measuring instrument (log), with no quantity or performance rating specified.
      de: Ein Knotenmessgerät misst die Fahrt durchs Wasser; ein Log misst die zurückgelegte Strecke. In dieser Kategorie ist ein Knotenmessgerät oder ein Log vorgeschrieben; Stückzahl oder Leistungswerte sind nicht festgelegt.
