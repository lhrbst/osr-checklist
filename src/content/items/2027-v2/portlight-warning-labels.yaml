id: portlight-warning-labels
drawing: portlight-warning-labels
rules:
  - 3.08.3
name:
  en: Inward-opening portlight labels
  de: Warnschilder an nach innen öffnenden Fenstern (Portlight Labels)
applies:
  osr2:
    section: below-deck
    order: 20
    pages:
      - 10
    cardHash: sha256:b9a39de1323252c0830c1c463e34e210e475c0e6aa2a4f0374b4c921b9f81414
    sourceHash: sha256:83d451085168325e06daa68cb79ee17b2b24145ea5add9458525f849b965f398
    explanation:
      en: This rule concerns labels on hatches that do not meet the opening-direction or security requirements in 3.08.1 or 3.08.2. Such hatches must be clearly marked “NOT TO BE OPENED AT SEA”; an inward-opening port with an area under 0.071 m² is excepted from the opening-direction rule, so that fact alone does not require this label.
      de: Die Regel betrifft Luken, die den Anforderungen an Öffnungsrichtung oder Sicherung nach 3.08.1 oder 3.08.2 nicht entsprechen. Solche Luken müssen gut sichtbar mit „NOT TO BE OPENED AT SEA“ gekennzeichnet sein; ein nach innen öffnendes Fenster mit weniger als 0,071 m² Fläche ist von der Vorgabe zur Öffnungsrichtung ausgenommen und muss allein deshalb nicht so gekennzeichnet werden.
