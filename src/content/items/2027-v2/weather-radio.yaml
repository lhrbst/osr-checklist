id: weather-radio
drawing: weather-radio
rules:
  - 3.29.4
name:
  en: Weather radio receiver
  de: Wetterfunkempfänger (Weather Radio Receiver)
applies:
  osr2:
    section: bunks
    order: 10
    pages:
      - 15
    cardHash: sha256:3c4d7b3364b8508d620a670e5c2c4fe893ef896983ac60f1e6d917b0e6640392
    sourceHash: sha256:75fc5e83b4abce3cee2a14583b094a9c3b3982645c5bb9b10f6bca226bc5423d
    explanation:
      en: Carry a second radio receiver that can receive weather bulletins. The handheld VHF required for a grab bag may also serve as this receiver; no particular size or power rating is specified here.
      de: An Bord muss ein zweiter Funkempfänger sein, der Wetterberichte empfangen kann. Das für eine Grab Bag vorgeschriebene Handfunkgerät kann diese Aufgabe ebenfalls erfüllen; eine bestimmte Größe oder Sendeleistung ist hier nicht festgelegt.
