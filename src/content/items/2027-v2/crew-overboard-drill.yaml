id: crew-overboard-drill
drawing: crew-overboard-drill
rules:
  - "6.04"
name:
  en: Crew-overboard recovery drill
  de: Mensch-über-Bord-Übung (Crew-overboard Recovery Drill)
applies:
  osr2:
    section: chart-table
    order: 80
    pages:
      - 24
    cardHash: sha256:2b016fa7d07eb4f67854baafc0c741958e9bd5709c69b40ecd9b65f11d7e70e5
    sourceHash: sha256:dc59275e185c763898712ad6c67a0059cbf4a868acc9355e295e6508f224a5e8
    explanation:
      en: This is a practice drill for recovering a crew member who has fallen overboard. The crew must practise it at least once a year; no particular method or equipment is specified here.
      de: Bei dieser Übung wird trainiert, wie ein über Bord gegangener Crewmitglied geborgen wird. Die Crew muss sie mindestens einmal jährlich üben; eine bestimmte Methode oder Ausrüstung ist hier nicht vorgeschrieben.
