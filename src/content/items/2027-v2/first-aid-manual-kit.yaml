name:
  en: First-aid manual and kit
  de: Erste-Hilfe-Handbuch und Bordapotheke (First Aid Manual and Kit)
applies:
  osr2:
    section: bunks
    order: 30
    pages:
      - 17
    cardHash: sha256:c09471c6158853104383cdc7983981822d10d26a803aa21e167cfb6f78c1b3e1
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: Carry a first-aid manual and a first-aid kit. Choose the kit’s contents and storage to suit the likely passage conditions and duration, and the number of crew members.
      de: Führt ein Erste-Hilfe-Handbuch und einen Erste-Hilfe-Kasten mit. Inhalt und Aufbewahrung des Kastens müssen zu den voraussichtlichen Bedingungen und zur Dauer der Fahrt sowie zur Anzahl der Besatzungsmitglieder passen.
