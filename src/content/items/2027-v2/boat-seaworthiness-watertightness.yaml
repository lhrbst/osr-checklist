      - 7
    cardHash: sha256:bcf541b78826fd0d7f0afcad43618cd2bfe13626e7b11da8cdace6416ec59579
    sourceHash: sha256:9bf138db443ff55bba02412185849f8d64447f567df14e346de9d5d6d4767330
    explanation:
      en: The boat must be properly rigged and seaworthy, with shrouds and at least one forestay that stays connected while racing; the forestay must withstand full sailing loads independently of the headsail luff. It must be essentially watertight, and all openings must be capable of being secured immediately; any board trunk opening into the hull interior must have a watertight maintenance hatch whose opening is entirely above the waterline.
      de: Das Boot muss korrekt geriggt und hochseetüchtig sein. Wanten und mindestens ein Vorstag müssen während der Wettfahrt mit Mast und Boot verbunden bleiben; das Vorstag muss die vollen Segellasten unabhängig von der Belastbarkeit des Vorsegelvorlieks aufnehmen können. Das Boot muss im Wesentlichen wasserdicht sein und alle Öffnungen müssen sofort gesichert werden können; ein Schwertkasten, der zum Bootsinneren offen ist, braucht eine wasserdichte Wartungsluke, deren Öffnung vollständig oberhalb der Wasserlinie liegt.
