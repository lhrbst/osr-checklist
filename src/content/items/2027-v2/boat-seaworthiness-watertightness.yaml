id: boat-seaworthiness-watertightness
drawing: boat-seaworthiness-watertightness
rules:
  - "3.02"
name:
  en: Boat strength, seaworthiness and watertightness
  de: Festigkeit, Seetüchtigkeit und Wasserdichtigkeit (Seaworthiness and Watertightness)
applies:
  osr2:
    section: general
    order: 30
    pages:
      - 7
    cardHash: sha256:bcf541b78826fd0d7f0afcad43618cd2bfe13626e7b11da8cdace6416ec59579
    sourceHash: sha256:899622521a2e3250b9f0eac265a2dfc96a31965a7e9e18a678a7dd90f1d38e74
    explanation:
      en: The boat must be properly rigged and seaworthy, with shrouds and at least one forestay that stays connected while racing; the forestay must withstand full sailing loads independently of the headsail luff. It must be essentially watertight, with openings securable immediately, and any board trunk opening into the hull interior must have a watertight maintenance hatch entirely above the waterline. For monohulls in Categories 0–2, an independent qualified person must inspect the boat out of the water; evidence of inspection is required within 24 months before the race or since grounding, whichever is later, and welded metal keels require non-destructive testing from 2030, within 10 years before the race or since grounding, whichever is later; after each unintentional grounding, an appropriately qualified person must inspect internally and externally.
      de: Das Boot muss korrekt geriggt und hochseetüchtig sein. Wanten und mindestens ein Vorstag müssen während der Wettfahrt mit Mast und Boot verbunden bleiben; das Vorstag muss die vollen Segellasten unabhängig von der Belastbarkeit des Vorsegelvorlieks aufnehmen können. Das Boot muss im Wesentlichen wasserdicht sein, und alle Öffnungen müssen sofort gesichert werden können; ein Schwertkasten, der zum Bootsinneren offen ist, braucht eine wasserdichte Wartungsluke, deren Öffnung vollständig oberhalb der Wasserlinie liegt. Bei Einrumpfbooten der Kategorien 0–2 muss eine unabhängige qualifizierte Person das Boot außerhalb des Wassers strukturell prüfen; der Nachweis darf bei Wettfahrtbeginn höchstens 24 Monate alt sein, wobei eine spätere Grundberührung maßgeblich ist. Ab 2030 ist für geschweißte Metallkiele außerdem eine zerstörungsfreie Prüfung nachzuweisen, höchstens 10 Jahre vor Wettfahrtbeginn oder seit der letzten Grundberührung; nach jeder unbeabsichtigten Grundberührung ist eine Innen- und Außenprüfung durch eine entsprechend qualifizierte Person erforderlich.
