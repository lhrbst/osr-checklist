    explanation:
      en: The boat must be properly rigged and seaworthy, with shrouds and at least one forestay that stays connected while racing; the forestay must withstand full sailing loads independently of the headsail luff. It must be essentially watertight, with openings securable immediately, and any board trunk opening into the hull interior must have a watertight maintenance hatch entirely above the waterline. At a haul-out within two years before the event, the owner or representative must inspect the keel and rudder following Appendix L; after each unintentional grounding, an appropriately qualified person must inspect internally and externally.
      de: Das Boot muss korrekt geriggt und hochseetüchtig sein. Wanten und mindestens ein Vorstag müssen während der Wettfahrt mit Mast und Boot verbunden bleiben; das Vorstag muss die vollen Segellasten unabhängig von der Belastbarkeit des Vorsegelvorlieks aufnehmen können. Das Boot muss im Wesentlichen wasserdicht sein, und alle Öffnungen müssen sofort gesichert werden können; ein Schwertkasten, der zum Bootsinneren offen ist, braucht eine wasserdichte Wartungsluke, deren Öffnung vollständig oberhalb der Wasserlinie liegt. Bei einem Kranen innerhalb der zwei Jahre vor der Veranstaltung muss der Eigner oder eine Vertretung Kiel und Ruder nach den Empfehlungen in Appendix L prüfen; nach jeder unbeabsichtigten Grundberührung ist eine Innen- und Außenprüfung durch eine entsprechend qualifizierte Person erforderlich.
