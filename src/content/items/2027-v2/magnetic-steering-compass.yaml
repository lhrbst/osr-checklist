id: magnetic-steering-compass
drawing: magnetic-steering-compass
rules:
  - "3.24"
name:
  en: Unpowered magnetic steering compass
  de: Stromunabhängiger Magnetsteuerkompass (Magnetic Compass)
applies:
  osr2:
    section: general
    order: 140
    pages:
      - 14
    cardHash: sha256:6d247c4bb6ff20a0f6e511640f96fd40b5d5df174fd2a7738aa69cf3d0cec4bc
    sourceHash: sha256:16cb8a9ea3b4fd5c29578265a8522bcba17c08263e6b382e472298939e57de31
    explanation:
      en: For boats in MoMu 0, 1, 2 or 3, carry a marine magnetic compass suitable for steering. It must be permanently installed, work independently of any power supply, be correctly adjusted and have a deviation card; also carry a second compass, which may be handheld and/or electronic.
      de: Boote der Kategorien MoMu 0, 1, 2 oder 3 müssen einen zum Steuern geeigneten Magnetkompass an Bord haben. Er muss fest eingebaut, unabhängig von einer Stromversorgung und korrekt eingestellt sein; eine Deviationstabelle muss vorhanden sein. Zusätzlich ist ein zweiter Kompass vorgeschrieben, der handgehalten und/oder elektronisch sein darf.
