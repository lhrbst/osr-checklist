    explanation:
      en: Carry one permanently installed marine magnetic steering compass. It must work independently of any power supply, be correctly adjusted and have a deviation card; this category’s text does not specify a second compass.
      de: Vorgeschrieben ist ein fest eingebauter Magnet-Steuerkompass. Er muss unabhängig von einer Stromversorgung funktionieren und korrekt eingestellt sein; eine Deviationstabelle muss vorhanden sein. Für diese Kategorie nennt der Text keinen zweiten Kompass.
