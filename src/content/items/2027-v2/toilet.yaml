    explanation:
      en: This item is a toilet for onboard use. For categories MoMu 0, 1 and 2, it must be permanently installed; a fitted bucket is not listed as an alternative.
      de: Bei diesem Ausrüstungspunkt geht es um eine Toilette an Bord. Für die Kategorien MoMu 0, 1 und 2 muss sie fest eingebaut sein; ein Eimer ist nicht als Alternative aufgeführt.
