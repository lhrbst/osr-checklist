    explanation:
      en: This item provides a toilet facility on board. For categories MoMu 3 and 4, the boat must have either a permanently installed toilet or a fitted bucket.
      de: Dieser Ausrüstungspunkt verlangt eine Toilettenmöglichkeit an Bord. Für die Kategorien MoMu 3 und 4 muss das Boot entweder eine fest eingebaute Toilette oder einen dafür vorgesehenen Eimer haben.
