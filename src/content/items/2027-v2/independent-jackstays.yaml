id: independent-jackstays
drawing: independent-jackstays
rules:
  - 4.04.2
name:
  en: Independent jackstays on each side
  de: Unabhängige Strecktaue auf beiden Seiten (Jackstays)
applies:
  osr2:
    section: demonstrate-use
    order: 40
    pages:
      - 16
    cardHash: sha256:fee3ee5c2e4c258dd2315d096deffa398a1eedd326521bff4a5314e805689b22
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: The boat must have independent jackstays on each side of the deck. They must let crew move readily between deck work areas and the cockpit(s) with minimal clipping and unclipping, and have a breaking strength of at least 2,040 kg; permitted materials are uncoated, unsleeved 1×19 stainless-steel wire at least 5 mm in diameter, webbing, or HMPE rope.
      de: Das Boot muss auf jeder Decksseite eine unabhängige Jackstag-Anordnung haben. Die Jackstagen müssen den Weg zwischen den Arbeitsbereichen an Deck und dem Cockpit bzw. den Cockpits mit möglichst wenigen Ein- und Ausklinkvorgängen ermöglichen und eine Bruchlast von mindestens 2.040 kg haben; zulässig sind unbeschichtetes, unummanteltes Edelstahlseil 1×19 mit mindestens 5 mm Durchmesser, Gurtband oder HMPE-Tauwerk.
