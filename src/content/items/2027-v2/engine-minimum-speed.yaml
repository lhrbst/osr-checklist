id: engine-minimum-speed
drawing: engine-minimum-speed
rules:
  - 3.28.1
name:
  en: Propulsion engine minimum speed
  de: Mindestgeschwindigkeit unter Motor (Propulsion Engine Minimum Speed)
applies:
  osr2:
    section: general
    order: 170
    pages:
      - 14
    cardHash: sha256:dda77ab0f4aa58029cb820daf36b3d00bf92abe281640911b698088e5d0f7c91
    sourceHash: sha256:16cb8a9ea3b4fd5c29578265a8522bcba17c08263e6b382e472298939e57de31
    explanation:
      en: This requirement sets the minimum speed the propulsion engine must be able to achieve. For OSR 2, the engine must provide at least 1.8 × the square root of the boat’s waterline length in metres, or the square root of its waterline length in feet, in knots.
      de: Diese Vorgabe legt die Mindestgeschwindigkeit des Antriebsmotors fest. Für OSR 2 muss der Motor mindestens 1,8 × die Quadratwurzel der Wasserlinienlänge in Metern oder die Quadratwurzel der Wasserlinienlänge in Fuß erreichen, jeweils in Knoten.
  osr3:
    section: general
    order: 180
    pages:
      - 13
    cardHash: sha256:dda77ab0f4aa58029cb820daf36b3d00bf92abe281640911b698088e5d0f7c91
    sourceHash: sha256:e9339fd413b8ff88c1f1d2a734b5f69d7edd1a7710c26994adb539805fa71c7f
    explanation:
      en: This requirement sets the minimum speed the propulsion engine must be able to achieve. For OSR 3, the engine must provide at least 1.8 × the square root of the boat’s waterline length in metres, or the square root of its waterline length in feet, in knots.
      de: Diese Vorgabe legt die Mindestgeschwindigkeit des Antriebsmotors fest. Für OSR 3 muss der Motor mindestens 1,8 × die Quadratwurzel der Wasserlinienlänge in Metern oder die Quadratwurzel der Wasserlinienlänge in Fuß erreichen, jeweils in Knoten.
  osr3-liferaft:
    section: general
    order: 180
    pages:
      - 13
    cardHash: sha256:dda77ab0f4aa58029cb820daf36b3d00bf92abe281640911b698088e5d0f7c91
    sourceHash: sha256:e9339fd413b8ff88c1f1d2a734b5f69d7edd1a7710c26994adb539805fa71c7f
    explanation:
      en: This requirement sets the minimum speed the propulsion engine must be able to achieve. For OSR 3 + liferaft, the engine must provide at least 1.8 × the square root of the boat’s waterline length in metres, or the square root of its waterline length in feet, in knots.
      de: Diese Vorgabe legt die Mindestgeschwindigkeit des Antriebsmotors fest. Für OSR 3 + Rettungsinsel muss der Motor mindestens 1,8 × die Quadratwurzel der Wasserlinienlänge in Metern oder die Quadratwurzel der Wasserlinienlänge in Fuß erreichen, jeweils in Knoten.
