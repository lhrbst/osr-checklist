id: storm-jib
drawing: storm-jib
rules:
  - 4.26.6
name:
  en: Storm jib with permanent independent attachment
  de: Sturmfock mit fester unabhängiger Befestigung (Storm Jib)
applies:
  osr2:
    section: demonstrate-use
    order: 120
    pages:
      - 20
    cardHash: sha256:b1cb2984aa7d6dba1635ceb2273af3622fa79433ebe984c4d29e43b8152cfbe4
    sourceHash: sha256:47a4897c570a091b9eb2a520d90d99df380f0b77d2017921be9bdaedcaaab09d
    explanation:
      en: A storm jib is a small sail intended for use in storm conditions. OSR 4.26.6 requires one storm jib for this category; the text gives no dimensions or rating for it and does not specify a permanent independent attachment.
      de: Eine Sturmfock ist ein kleines Segel für den Einsatz bei Sturm. OSR 4.26.6 verlangt für diese Kategorie eine Sturmfock; Maße oder eine Einstufung nennt der Text nicht und eine dauerhaft unabhängige Befestigung ist darin nicht festgelegt.
