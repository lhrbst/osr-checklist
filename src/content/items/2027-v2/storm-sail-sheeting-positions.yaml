    explanation:
      en: The boat must have deck sheeting positions for every storm and heavy-weather sail. The rule gives no number or dimensions for these positions.
      de: Für jedes Sturm- und Starkwindsegel müssen auf Deck Schotpositionen vorhanden sein. Die Vorschrift nennt dafür weder eine Anzahl noch Maße.
