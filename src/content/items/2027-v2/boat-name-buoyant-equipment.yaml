id: boat-name-buoyant-equipment
drawing: boat-name-buoyant-equipment
rules:
  - "4.17"
name:
  en: Boat name on buoyant equipment
  de: Bootsname auf schwimmfähiger Ausrüstung (Boat’s Name)
applies:
  osr2:
    section: general
    order: 240
    pages:
      - 17
    cardHash: sha256:6fad3404e69b0d213eb1457c9822511c56176d5f4ca845d692bd6267b9b97096
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: Mark the boat’s name on its miscellaneous buoyant equipment. This includes items such as lifejackets, cushions, lifebuoys, recovery slings and grab bags; no quantity or size is specified.
      de: Der Bootsname muss auf sonstiger schwimmfähiger Ausrüstung des Boots angebracht sein. Dazu gehören beispielsweise Schwimmwesten, Kissen, Rettungsringe, Bergeschlaufen und Grab Bags; eine Anzahl oder Größe ist nicht vorgegeben.
