    explanation:
      en: Below-deck handholds are grips fitted inside the boat. OSR 2 requires adequate handholds below deck; it does not specify a number, size, or rating.
      de: Handgriffe unter Deck sind Griffe im Bootsinneren. OSR 2 verlangt ausreichend Handgriffe unter Deck; Anzahl, Größe und Belastbarkeit sind nicht näher festgelegt.
