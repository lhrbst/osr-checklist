id: two-metre-tethers
drawing: two-metre-tethers
rules:
  - 5.02.2
name:
  en: Two-metre safety tethers
  de: Zwei-Meter-Sicherheitsleinen (Tethers)
applies:
  osr2:
    section: bunks
    order: 140
    pages:
      - 23
    cardHash: sha256:868d40a464d73b5b656c719ad4f11fe179c877e0653122e253bba0614f1a31ce
    sourceHash: sha256:f7ab4570452c85222c71e59fc724efc2f68c45a10b164d9df7d57dcaac227d95
    explanation:
      en: Each crewmember must have a safety tether complying with ISO 12401 or equivalent. It must be no longer than 2 m including its hooks, have self-closing hooks and a stitched-in overload indicator, and have been made after 2000; each crewmember must also have either a tether no longer than 1 m or a 2 m tether with an intermediate self-closing hook.
      de: Jedes Crewmitglied muss eine Sicherheitsleine nach ISO 12401 oder gleichwertigem Standard haben. Sie darf einschließlich der Haken höchstens 2 m lang sein, muss selbstschließende Haken und eine eingenähte Überlastungsanzeige haben und nach 2000 hergestellt worden sein; zusätzlich braucht jedes Crewmitglied entweder eine höchstens 1 m lange Leine oder eine 2-m-Leine mit einem zusätzlichen selbstschließenden Zwischenhaken.
