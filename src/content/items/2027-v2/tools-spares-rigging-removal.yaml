id: tools-spares-rigging-removal
drawing: tools-spares-rigging-removal
rules:
  - 4.16.1
name:
  en: Tools, spares and rigging removal
  de: Werkzeug, Ersatzteile und Riggtrennung (Tools, Spares and Rigging Removal)
applies:
  osr2:
    section: bunks
    order: 50
    pages:
      - 17
    cardHash: sha256:e7ae61c004b8a642c72a120e03296827115a36aa1b2a388353e45e246aa45219
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: Carry tools and spare parts suited to the passage’s duration and nature. Also carry an effective way to quickly disconnect or cut the standing rigging free from the boat; no quantities or dimensions are specified.
      de: Führen Sie Werkzeug und Ersatzteile mit, die zur Dauer und Art der Reise passen. Außerdem muss ein wirksames Mittel an Bord sein, um das stehende Gut schnell vom Boot zu lösen oder zu durchtrennen; Mengen oder Maße sind nicht festgelegt.
