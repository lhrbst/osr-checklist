id: liferaft-service-certificate
drawing: liferaft-service-certificate
rules:
  - 4.20.4
name:
  en: Liferaft servicing certificate
  de: Wartungsnachweis der Rettungsinsel (Liferaft Servicing Certificate)
applies:
  osr2:
    section: chart-table
    order: 60
    pages:
      - 19
    cardHash: sha256:6744a3ab4b914d7aa84d110e20ce10e8feb73b216bda357fc49f880ef877f0f0
    sourceHash: sha256:41b43dfb746c4983958c2b9ae40cb4b42383b68acbc50faa6761853ea8ceb9f1
    explanation:
      en: The liferaft must be serviced at a manufacturer-authorized service station. Maximum intervals are annual for SOLAS, ISAF and ORC rafts, and every three years for ISO 9650 canister-packed rafts; ISO 9650 valise-packed rafts are serviced every three years, or annually if hired. Keep the servicing certificate, original or copy, on board.
      de: Die Rettungsinsel muss bei einer vom Hersteller zugelassenen Servicestation gewartet werden. Die Höchstintervalle betragen ein Jahr für SOLAS-, ISAF- und ORC-Inseln sowie drei Jahre für ISO-9650-Inseln im Container; ISO-9650-Inseln in einer Tasche werden alle drei Jahre gewartet, gemietete jedoch jährlich. Das Wartungszertifikat muss im Original oder als Kopie an Bord sein.
