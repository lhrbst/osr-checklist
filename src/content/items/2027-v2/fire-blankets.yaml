id: fire-blankets
drawing: fire-blankets
rules:
  - 4.05.1
name:
  en: Fire blankets
  de: Löschdecken (Fire Blankets)
applies:
  osr2:
    section: below-deck
    order: 170
    pages:
      - 16
    cardHash: sha256:e4ffd129cd6521c10ebe879c19a1e5d883d9a06a237335ba6733c78ab8c056bc
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: A fire blanket is a portable blanket for smothering a fire. Keep one next to every cooking device; the rule specifies no size or rating.
      de: Eine Löschdecke ist eine tragbare Decke zum Ersticken eines Feuers. Neben jedem Kochgerät muss eine liegen; Größe oder Leistungsklasse sind nicht vorgegeben.
