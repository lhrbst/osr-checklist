      de: Jedes Crewmitglied benötigt eine aufblasbare Rettungsweste nach ISO 12402-3, Stufe 150, hergestellt nach 2011 und passend zur auf der Weste angegebenen Größe; sie muss eine manuelle oder automatische Auslösung haben und dauerhaft mit dem Namen des Eigners oder Bootes gekennzeichnet sein. Die verantwortliche Person muss prüfen, dass die Wartungsfrist jeder Weste noch nicht abgelaufen ist.
