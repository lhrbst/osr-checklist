id: crew-lifejackets
drawing: crew-lifejackets
rules:
  - "5.01"
name:
  en: Crew lifejackets
  de: Rettungswesten für die Crew (Lifejackets)
applies:
  osr2:
    section: bunks
    order: 90
    pages:
      - 23
    cardHash: sha256:0575eb9c5bd77a58b057a688ace4f143fa9a5445d0814071ca2cddad0b87df79
    sourceHash: sha256:f7ab4570452c85222c71e59fc724efc2f68c45a10b164d9df7d57dcaac227d95
    explanation:
      en: Each crewmember must have a gas-inflatable lifejacket rated ISO 12402-3 Level 150, made after 2011, and sized for them as marked on the PFD; it must have a manual or automatic inflation system, a crotch or thigh strap, and the owner’s or boat’s name marked indelibly. An emergency light and sprayhood are required for MoMu 0–3, and a deck-harness attachment for MoMu 0–2; the person in charge must check that each jacket is in date for servicing, and the boat must carry at least one spare jacket and a spare cylinder for each jacket type (plus an activation head where appropriate).
      de: Jedes Crewmitglied benötigt eine aufblasbare Rettungsweste nach ISO 12402-3, Stufe 150, hergestellt nach 2011 und passend zur auf der Weste angegebenen Größe; sie muss eine manuelle oder automatische Auslösung, einen Schritt- oder Beinschutzgurt und eine dauerhaft angebrachte Kennzeichnung mit dem Namen des Eigners oder Bootes haben. Für MoMu 0–3 sind Notlicht und Sprayhood vorgeschrieben, für MoMu 0–2 außerdem ein Anschluss für den Decksicherheitsgurt; die verantwortliche Person muss die fristgerechte Wartung prüfen, und an Bord müssen mindestens eine Ersatzweste sowie je Westenart eine Ersatzgaspatrone (gegebenenfalls mit Ersatz-Auslösekopf) vorhanden sein.
