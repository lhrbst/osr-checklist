id: companionway-sill
drawing: companionway-sill
rules:
  - 3.08.5
name:
  en: Companionway sill or alternative
  de: Niedergangssüll oder Alternative (Companionway Sill)
applies:
  osr2:
    section: general
    order: 60
    pages:
      - 10
    cardHash: sha256:b3938e60ad2b2b51152b3c28bd4a7168592d48e0cfafab8231b7dcd1e9c88506
    sourceHash: sha256:83d451085168325e06daa68cb79ee17b2b24145ea5add9458525f849b965f398
    explanation:
      en: For a monohull with one or more cockpits that are not contained cockpits, the companionway must have either a sill no lower than the local sheerline or a companionway that fully complies with ISO 11812 Category A. The rule gives these as alternatives; it specifies no quantity or size.
      de: Bei einem Einrumpfboot mit einem oder mehreren nicht geschlossenen Cockpits muss der Niedergang entweder eine Schwelle haben, die nicht unter der örtlichen Schandeckslinie liegt, oder vollständig ISO 11812, Kategorie A, entsprechen. Die Vorschrift nennt diese Möglichkeiten als Alternativen; Mengen- oder Größenangaben macht sie nicht.
