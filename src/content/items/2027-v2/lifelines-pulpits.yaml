id: lifelines-pulpits
drawing: lifelines-pulpits
rules:
  - "3.14"
name:
  en: Double lifelines and pulpits
  de: Doppelte Seereling und Relingskörbe (Lifelines and Pulpits)
applies:
  osr2:
    section: general
    order: 80
    pages:
      - 11
    cardHash: sha256:634b7effa24af02d38395b602d6f67d14e6782a34f4ea99de025ae9122fc6a03
    sourceHash: sha256:aa2fe2b1ae0027daa31d1364bafa3337dd75d3c4bd54d622098aa05bcd1fef2f
    explanation:
      en: "This item is the perimeter safety-rail system: lifelines, pulpits and their stanchions. Lifelines must run continuously between near the bow and stern (one gate per side is allowed), move freely fore and aft except at ends and gates, have at least 600 mm upper and 230 mm intermediate height, and leave vertical gaps no larger than 380 mm (560 mm for boats with a series date before 1993); they must be supported at intervals no greater than 2.2 m and must not run outboard of their supports. Pulpit and stanchion bases must be permanently fitted and mechanically retain the rails; their tubes must lie within the stated deck-edge limits, and stanchions must be vertical, with no more than 10 mm sideways displacement in the first 50 mm above the deck."
      de: Gemeint ist das Sicherheitsgeländer am Decksrand aus Relingsdrähten, Bug-/Heckkorb und Stützen. Die Relingsdrähte müssen nahe Bug und Heck durchgehend befestigt sein (je Seite ist ein Durchgang erlaubt), außer an Enden und Durchgängen längs frei beweglich bleiben, mindestens 600 mm obere und 230 mm mittlere Höhe haben und senkrechte Öffnungen von höchstens 380 mm lassen (bei Booten mit Seriendatum vor 1993 höchstens 560 mm); sie müssen spätestens alle 2,2 m gestützt sein und dürfen nicht außen an den Stützen vorbeilaufen. Körbe und Stützen müssen dauerhaft montiert und mechanisch in ihren Sockeln gehalten sein; ihre Rohre müssen innerhalb der angegebenen Grenzen zum Decksrand liegen, und die Stützen müssen senkrecht stehen, mit höchstens 10 mm seitlicher Abweichung in den ersten 50 mm über Deck.
  osr3:
    section: general
    order: 90
    pages:
      - 10
    cardHash: sha256:634b7effa24af02d38395b602d6f67d14e6782a34f4ea99de025ae9122fc6a03
    sourceHash: sha256:3087b576bb94ef6e3e3191098d846eb2aeeb3ba39333ea53f600fca24ad521e8
    explanation:
      en: This item is the deck-edge safety-rail system of lifelines, pulpits and stanchions. Lifelines must run continuously between near the bow and stern (one gate per side is allowed), move freely fore and aft except at ends and gates, and have upper and intermediate heights of at least 600 mm and 230 mm; vertical gaps are limited to 380 mm, or 560 mm for boats with a series date before 1993. They must be supported at intervals no greater than 2.2 m and not pass outboard of their supports; bases must be permanently installed and mechanically retain the pulpits and stanchions, which must meet the stated deck-edge position limits and be vertical except for up to 10° lean above 50 mm from deck (with no more than 10 mm displacement in the first 50 mm); an open bow pulpit is allowed if its gap to the boat is no more than 360 mm. Where the marked MoMu 3,4 provision applies, boats under 8.5 m LH may instead have a single lifeline system 450–560 mm high.
      de: Gemeint ist das Sicherheitsgeländer am Decksrand aus Relingsdrähten, Körben und Stützen. Die Drähte müssen nahe Bug und Heck durchgehend befestigt sein (je Seite ist ein Durchgang erlaubt), außer an Enden und Durchgängen längs frei beweglich bleiben und mindestens 600 mm obere sowie 230 mm mittlere Höhe haben; senkrechte Öffnungen dürfen höchstens 380 mm betragen, bei Booten mit Seriendatum vor 1993 höchstens 560 mm. Die Drähte müssen spätestens alle 2,2 m gestützt sein und dürfen nicht außen an den Stützen vorbeilaufen; Körbe und Stützen müssen dauerhaft montiert und mechanisch in den Sockeln gehalten sein, innerhalb der angegebenen Grenzen zum Decksrand liegen und grundsätzlich senkrecht stehen (ab 50 mm über Deck höchstens 10° Neigung, in den ersten 50 mm höchstens 10 mm seitliche Abweichung); ein offener Bugkorb ist mit höchstens 360 mm Abstand zum Boot zulässig. Wo die mit MoMu 3,4 gekennzeichnete Regel gilt, dürfen Boote unter 8,5 m LH stattdessen eine einzügige Reling mit 450–560 mm Höhe haben.
