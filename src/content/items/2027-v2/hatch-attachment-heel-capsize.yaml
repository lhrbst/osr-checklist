id: hatch-attachment-heel-capsize
drawing: hatch-attachment-heel-capsize
rules:
  - 3.08.2
name:
  en: Hatch attachment and capsize operation
  de: Lukenbefestigung und Bedienbarkeit bei Kenterung (Hatches)
applies:
  osr2:
    section: general
    order: 50
    pages:
      - 9
      - 10
    cardHash: sha256:c9fc8c801b15d4538a5a5b10284baf5b69ed1d5d71a9d2fa831a9860587f53d4
    sourceHash: sha256:b2d8699424cee73ded4fd432c1263c67984ac749906c2b24f7b195efbc56864f
    explanation:
      en: Every hatch, including one over a locker, must be permanently attached and able to be shut promptly and stay shut if the boat turns upside down. It must also remain above water when the boat heels 90°; at most two hatches on each side of the centreline may fail this condition, and only if each opening is under 0.071 m² (110 in²).
      de: Jede Luke, auch eine Luke über einem Stauraum, muss fest angebracht sein und sich sofort sicher verschließen lassen, sodass sie sich bei einer Kenterung um 180° nicht öffnet. Außerdem muss sie bei 90° Krängung über Wasser bleiben; auf jeder Seite der Mittschiffslinie dürfen höchstens zwei Luken davon abweichen, sofern jede Öffnung kleiner als 0,071 m² (110 in²) ist.
