id: workstation-clipping-points
drawing: workstation-clipping-points
rules:
  - 4.04.3
name:
  en: Workstation clipping points
  de: Einpickpunkte an Arbeitsplätzen (Clipping Points)
applies:
  osr2:
    section: demonstrate-use
    order: 60
    pages:
      - 16
    cardHash: sha256:61b620770423ae54e144853fed7b676b78f7415f4c5a326cefc199fe532367a9
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: Workstation clipping points are attachment points for crew safety lines near places where people work, such as the helm, sheet winches and masts. They must let a crew member clip on before coming on deck and unclip after going below, and allow two-thirds of the crew to be clipped on at the same time without relying on jackstays.
      de: Anschlagpunkte für Sicherheitsleinen liegen nahe Arbeitsplätzen wie Steuerstand, Schotwinschen und Mast. Sie müssen ermöglichen, dass sich ein Crewmitglied vor dem Gang an Deck einhängt und erst nach dem Gang unter Deck wieder aushängt; zugleich müssen sich zwei Drittel der Crew gleichzeitig einhängen können, ohne auf Lifelines angewiesen zu sein.
