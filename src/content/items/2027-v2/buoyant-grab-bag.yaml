id: buoyant-grab-bag
drawing: buoyant-grab-bag
rules:
  - 4.21.1
name:
  en: Buoyant, highly visible grab bag
  de: Schwimmfähige, auffällige Notfalltasche (Grab Bag)
applies:
  osr2:
    section: grab-bag
    order: 30
    pages:
      - 19
    cardHash: sha256:a7c33e4658154899b525c8f1a7f797da2ec96c32cfad42a016f15c003c237a1f
    sourceHash: sha256:41b43dfb746c4983958c2b9ae40cb4b42383b68acbc50faa6761853ea8ceb9f1
    explanation:
      en: The grab bag must float on its own and have at least 0.1 m² (1 ft²) of highly visible colour on its outside. Mark it with the boat’s name and fit it with a lanyard and clip; if it is assigned to a particular liferaft, mark which raft it belongs to. For MoMu 1 and 2, provide one per liferaft and keep it accessible even if the boat is inverted.
      de: Die Grab Bag muss selbst schwimmfähig sein und außen mindestens 0,1 m² gut sichtbare Farbe haben. Sie muss den Bootsnamen tragen und mit Leine und Karabiner versehen sein; ist sie einem bestimmten Rettungsfloß zugeordnet, muss diese Zuordnung erkennbar sein. Für MoMu 1 und 2 ist je Rettungsfloß eine Grab Bag vorgeschrieben, die auch bei gekentertem Boot zugänglich ist.
  osr3:
    section: grab-bag
    order: 30
    pages:
      - 16
    cardHash: sha256:a7c33e4658154899b525c8f1a7f797da2ec96c32cfad42a016f15c003c237a1f
    sourceHash: sha256:a3f01b0e4a5ced00bcac81b885ce22061d4d154145e3e4e31bb161998bb57fee
    explanation:
      en: The grab bag must float on its own and have at least 0.1 m² (1 ft²) of highly visible colour on its outside. Mark it with the boat’s name and fit it with a lanyard and clip.
      de: Die Grab Bag muss selbst schwimmfähig sein und außen mindestens 0,1 m² gut sichtbare Farbe haben. Sie muss den Bootsnamen tragen und mit Leine und Karabiner versehen sein.
  osr3-liferaft:
    section: grab-bag
    order: 30
    pages:
      - 18
    cardHash: sha256:a7c33e4658154899b525c8f1a7f797da2ec96c32cfad42a016f15c003c237a1f
    sourceHash: sha256:778aa199285963bf7bb09977927ef50b477d784f0ea64d9a6b067d79318d129a
    explanation:
      en: "The grab bag must float on its own and have at least 0.1 m² (1 ft²) of highly visible colour on its outside. Mark it with the boat’s name and fit it with a lanyard and clip; if it accompanies a particular liferaft, identify that raft. For Mo3, the specified items may be stowed with the raft or in a grab bag: 3 hand flares, a waterproof strobe light with spare batteries (which may be part of the flashlight), a knife and a whistle; the bag must be accessible even if the boat is inverted."
      de: "Die Grab Bag muss selbst schwimmfähig sein und außen mindestens 0,1 m² gut sichtbare Farbe haben. Sie muss den Bootsnamen tragen und mit Leine und Karabiner versehen sein; begleitet sie ein bestimmtes Rettungsfloß, muss dieses gekennzeichnet sein. Für Mo3 dürfen die vorgeschriebenen Gegenstände im Rettungsfloß oder in einer Grab Bag verstaut werden: 3 Handfackeln, ein wasserdichtes Blitzlicht mit Ersatzbatterien (auch als Teil der Taschenlampe möglich), ein Messer und eine Pfeife. Die Grab Bag muss auch bei gekentertem Boot zugänglich sein."
