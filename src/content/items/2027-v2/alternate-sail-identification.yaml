id: alternate-sail-identification
drawing: alternate-sail-identification
rules:
  - 4.01.2
name:
  en: Alternate sail identification display
  de: Alternative Anzeige der Segelkennung (Alternate Sail Identification)
applies:
  osr2:
    section: demonstrate-use
    order: 30
    pages:
      - 16
    cardHash: sha256:189f2e51e899dc310f9e7445a58492bfe77e605921c5dc301bbf86a3497017c5
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: The boat must carry an alternative way to show the mainsail’s identification. Display it whenever none of the numbered sails are set; the rule specifies no particular method or size.
      de: Das Boot muss eine alternative Möglichkeit mitführen, die Kennzeichnung des Großsegels zu zeigen. Sie ist anzubringen, wenn keines der nummerierten Segel gesetzt ist; eine bestimmte Ausführung oder Größe ist nicht vorgeschrieben.
