    explanation:
      en: Carry 2 orange smoke signals conforming to LSA Code Chapter III, section 3.3. They must be within any stamped expiry date, or no more than 4 years old if no expiry date is stamped; this category’s text does not specify red hand flares.
      de: Mitzuführen sind 2 orange Rauchsignale nach LSA-Code, Kapitel III, Abschnitt 3.3. Sie dürfen das aufgedruckte Ablaufdatum nicht überschritten haben; ohne Ablaufdatum dürfen sie höchstens 4 Jahre alt sein. Für diese Kategorie nennt der Text keine roten Handfackeln.
