id: distress-flares
drawing: distress-flares
rules:
  - "4.23"
name:
  en: Distress flares and smoke
  de: Handfackeln und Rauchsignale (Flares and Smoke Signals)
applies:
  osr2:
    section: bunks
    order: 80
    pages:
      - 20
    cardHash: sha256:5c6a1596603bd3398bacf57fc0141794d50a806059a225e6f3490a7cc5bac514
    sourceHash: sha256:47a4897c570a091b9eb2a520d90d99df380f0b77d2017921be9bdaedcaaab09d
    explanation:
      en: Carry 2 orange smoke signals and, for MoMu 0–3, 4 red hand flares. They must conform to LSA Code Chapter III, sections 3.3 and 3.2 respectively, and be within any stamped expiry date—or no more than 4 years old if no expiry date is stamped.
      de: Mitzuführen sind 2 orange Rauchsignale sowie für MoMu 0–3 4 rote Handfackeln. Sie müssen dem LSA-Code, Kapitel III, Abschnitte 3.3 beziehungsweise 3.2, entsprechen und dürfen das aufgedruckte Ablaufdatum nicht überschritten haben; ohne Ablaufdatum dürfen sie höchstens 4 Jahre alt sein.
