id: escape-exits
drawing: escape-exits
rules:
  - "3.06"
name:
  en: Two escape exits
  de: Zwei Fluchtöffnungen (Exits)
applies:
  osr2:
    section: below-deck
    order: 10
    pages:
      - 9
    cardHash: sha256:af362071aa9257d8615857f65bf13ec467d93996bc8b01cd8a56fef2122c70d2
    sourceHash: sha256:6a7a07fb837bd08f90b06c7e3df87348f02635407561d03d71fbcac45edf3816
    explanation:
      en: This item concerns escape routes on monohulls. If the series date is after 1994 and the boat’s LH is at least 8.5 m (28 ft), it must have at least two exits; one must be forward of the foremost mast unless structural features prevent fitting it.
      de: Dieser Punkt betrifft Notausgänge bei Einrumpfbooten. Liegt das Serienjahr nach 1994 und beträgt LH mindestens 8,5 m (28 ft), muss das Boot mindestens zwei Ausstiege haben; einer davon muss vor dem vordersten Mast liegen, sofern die Bauweise den Einbau dort nicht verhindert.
