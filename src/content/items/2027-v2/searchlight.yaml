id: searchlight
drawing: searchlight
rules:
  - "4.07"
name:
  en: Watertight searchlight
  de: Wasserdichter Suchscheinwerfer (Searchlight)
applies:
  osr2:
    section: on-deck
    order: 30
    pages:
      - 16
    cardHash: sha256:69e3e29947a8645c614eba497cc07727878949c167c02ae3db4bbc527f7fff70
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: The boat must carry a searchlight suitable for spotting a person overboard at night and for avoiding collisions. It must be watertight to at least IP67 and provide at least 400 lumens; it must have spare batteries or be rechargeable, and spare bulbs unless it is an LED type. For a boat with only two crewmembers, it must be reachable from the cockpit without going below.
      de: An Bord muss ein Suchscheinwerfer vorhanden sein, mit dem nachts eine Person über Bord gesucht und eine Kollision vermieden werden kann. Er muss mindestens Schutzart IP67 erfüllen und mindestens 400 Lumen liefern; außerdem braucht er Ersatzbatterien oder muss wiederaufladbar sein sowie Ersatzlampen, sofern er kein LED-Modell ist. Bei nur zwei Crewmitgliedern muss er vom Cockpit aus erreichbar sein, ohne unter Deck gehen zu müssen.
