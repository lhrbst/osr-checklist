id: anchors-rode
drawing: anchors-rode
rules:
  - 4.06.1
  - 4.06.2
name:
  en: Anchors and rode
  de: Anker und Ankergeschirr (Anchors and Rode)
applies:
  osr2:
    section: on-deck
    order: 20
    pages:
      - 16
    cardHash: sha256:c1f331453277bea8ecef12df33fc1230e3a7fefa207dc4ad20cad9df82e8e71f
    sourceHash: sha256:18dc1e7e115127c2f4fa9d95ac21dcf348fcba3a8e005ac042e9df9b30bb27bd
    explanation:
      en: The boat must carry two unmodified anchors sized to the manufacturer’s recommendation for the boat, with a suitable combination of chain and rope. They must be ready to assemble and deploy within five minutes; boats under 8.5 m LH need only one anchor meeting these requirements.
      de: An Bord müssen zwei unveränderte, nach Empfehlung des Herstellers für die Bootsmaße bemessene Anker sein, jeweils mit einer geeigneten Kombination aus Kette und Leine. Sie müssen sofort zusammengebaut und innerhalb von fünf Minuten ausgebracht werden können; bei Booten unter 8,5 m LH genügt ein Anker, der diese Anforderungen erfüllt.
