id: recovery-sling
drawing: recovery-sling
rules:
  - 4.22.5
name:
  en: Recovery sling
  de: Bergeschlinge (Recovery Sling)
applies:
  osr2:
    section: helm
    order: 70
    pages:
      - 20
    cardHash: sha256:e06e1b2643ea3ce7ebfc2ad07ac90f98e8a45436b6c22df18114dfbd902bce1d
    sourceHash: sha256:47a4897c570a091b9eb2a520d90d99df380f0b77d2017921be9bdaedcaaab09d
    explanation:
      en: A recovery sling is a buoyant system for recovering a person from the water. It must have a buoyant line at least as long as the shorter of four times the boat’s LH or 36 m, a horseshoe section providing at least 90 N of buoyancy, and strength sufficient to hoist a crewmember aboard.
      de: Eine Bergeschlinge ist ein schwimmfähiges System zur Bergung einer Person aus dem Wasser. Sie muss eine schwimmfähige Leine haben, die mindestens so lang ist wie der kürzere Wert aus dem Vierfachen der Bootslänge LH und 36 m, einen hufeisenförmigen Auftriebskörper mit mindestens 90 N Auftrieb und eine Festigkeit, die das An-Bord-Hieven eines Crewmitglieds ermöglicht.
