id: grab-bag-strobe
drawing: grab-bag-strobe
rules:
  - 4.21.4
name:
  en: Grab-bag strobe light
  de: Blitzleuchte in der Notfalltasche (Strobe Light)
applies:
  osr3:
    section: grab-bag
    order: 50
    pages:
      - 17
    cardHash: sha256:9c3776da824c9cf4aa4a8e94aaacb7849ed4ee6a70bb26d03f4f937b8208ca59
    sourceHash: sha256:562d37b39a07d7b23740fb3a0f66cb0a89db7c8c1040780a5c2a96582e883908
    explanation:
      en: Carry one watertight strobe light with spare batteries; it may be incorporated into a flashlight. Stow it with the liferaft or in a grab bag, which must remain readily accessible even if the boat is inverted.
      de: Führen Sie ein wasserdichtes Blinklicht mit Ersatzbatterien mit; es darf in eine Taschenlampe integriert sein. Es muss bei der Rettungsinsel oder in einer Grab Bag verstaut sein, die auch bei gekentertem Boot leicht erreichbar sein muss.
  osr3-liferaft:
    section: grab-bag
    order: 50
    pages:
      - 18
