id: second-compass
drawing: second-compass
rules:
  - "3.24"
name:
  en: Second compass
  de: Zweitkompass (Second Compass)
applies:
  osr2:
    section: general
    order: 150
    pages:
      - 14
    cardHash: sha256:99cc3087e9160956f3a3d7ccc1c137b60eebb628221f68d1a3fcc1bbe3e947ed
    sourceHash: sha256:16cb8a9ea3b4fd5c29578265a8522bcba17c08263e6b382e472298939e57de31
    explanation:
      en: The boat must carry a second compass in addition to the permanently installed marine magnetic steering compass. This second compass may be handheld, electronic, or both; no other specification is given.
      de: Zusätzlich zum fest eingebauten magnetischen Steuerkompass muss das Boot einen zweiten Kompass mitführen. Dieser darf handgehalten und/oder elektronisch sein; weitere Anforderungen sind nicht genannt.
