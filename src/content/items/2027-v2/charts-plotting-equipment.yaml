    cardHash: sha256:3b5db4fd450d13b751f19f2538e66112ca0ceab110e7cfd64c6adf31074d5504
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: Carry navigational charts and equipment for plotting your position and route. The charts must not be electronic-only; no quantity or chart scale is specified.
      de: Führen Sie Seekarten und Ausrüstung zum Eintragen von Position und Route mit. Die Seekarten dürfen nicht ausschließlich elektronisch sein; eine Stückzahl oder ein Kartenmaßstab ist nicht vorgegeben.
