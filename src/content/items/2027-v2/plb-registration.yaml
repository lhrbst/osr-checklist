id: plb-registration
drawing: plb-registration
rules:
  - 4.22.1
name:
  en: Optional PLB registration
  de: Registrierung optionaler Personen-Notfunkbaken (PLB Registration)
applies:
  osr2:
    section: bunks
    order: 70
    pages:
      - 19
    cardHash: sha256:9a59a7017891b85b7808567611ddefbc6a122fb3a3682c5db7ca9c1d8b77616a
    sourceHash: sha256:41b43dfb746c4983958c2b9ae40cb4b42383b68acbc50faa6761853ea8ceb9f1
    explanation:
      en: Where possible, each PLB should be registered with the appropriate authority for the country code in its 15-character hexadecimal ID. If that country has no registration service and permits direct registration, the beacon can be registered online with the Cospas-Sarsat IBRD.
      de: Wenn möglich, sollte jede PLB bei der zuständigen Behörde des Landes registriert werden, das zum 15-stelligen Hexadezimalcode der Kennung gehört. Bietet dieses Land keine Registrierung an und erlaubt es die direkte Registrierung, kann die PLB online in der Cospas-Sarsat-IBRD registriert werden.
