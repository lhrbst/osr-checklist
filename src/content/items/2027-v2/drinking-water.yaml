id: drinking-water
drawing: drinking-water
rules:
  - 3.21.1
name:
  en: Drinking-water supply
  de: Trinkwasservorrat (Drinking Water)
applies:
  osr2:
    section: below-deck
    order: 80
    pages:
      - 13
    cardHash: sha256:030c833666b85a454afad3526b5fc32528029b6c391b74e956420a98f9b0dd7d
    sourceHash: sha256:80e2c42d53f73f4e1645bda9e3b4f8027cf969770dc83c25ab4ae76ea65db72f
    explanation:
      en: This requirement covers the boat’s drinking-water supply for the passage. It must have a permanently installed delivery pump and water tank(s), or reusable containers, with enough capacity for the likely duration of the passage; no specific volume is stated.
      de: Diese Vorschrift betrifft die Trinkwasserversorgung an Bord während der Reise. Vorgeschrieben sind eine fest eingebaute Förderpumpe und ein oder mehrere Wassertanks oder wiederverwendbare Behälter, jeweils mit ausreichend Wasser für die voraussichtliche Reisedauer; eine genaue Menge ist nicht festgelegt.
