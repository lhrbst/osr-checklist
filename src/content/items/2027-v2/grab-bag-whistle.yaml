    sourceHash: sha256:562d37b39a07d7b23740fb3a0f66cb0a89db7c8c1040780a5c2a96582e883908
    explanation:
      en: The grab-bag whistle is a whistle carried with the liferaft or in a grab bag. OSR 3 requires one whistle; if kept in a grab bag, the bag must be readily accessible even when the boat is inverted. No type or rating is specified.
      de: Die Pfeife für die Grab Bag wird zusammen mit der Rettungsinsel oder in einer Grab Bag mitgeführt. OSR 3 verlangt eine Pfeife; wird sie in der Grab Bag aufbewahrt, muss diese auch bei kieloben liegendem Boot leicht zugänglich sein. Bauart oder Kennwerte sind nicht festgelegt.
