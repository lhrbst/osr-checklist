id: lifejacket-service-dates
drawing: lifejacket-service-dates
rules:
  - 5.01.4
name:
  en: Lifejacket servicing dates
  de: Wartungsfristen der Rettungswesten (Lifejacket Service Dates)
applies:
  osr2:
    section: bunks
    order: 120
    pages:
      - 23
    cardHash: sha256:5c31323b80a4aa3791cb67fbcfc309a6b4ff6ec42d4443b6e3adee2e76f3e819
    sourceHash: sha256:f7ab4570452c85222c71e59fc724efc2f68c45a10b164d9df7d57dcaac227d95
    explanation:
      en: This requirement concerns keeping each lifejacket serviced and in date. The person in charge must personally check that every lifejacket has been serviced as recommended by its manufacturer at an approved service station and that its marked next service date has not passed.
      de: Diese Vorschrift betrifft die Wartung und den Wartungstermin jeder Rettungsweste. Die verantwortliche Person muss persönlich prüfen, dass jede Weste gemäß den Empfehlungen des Herstellers von einer zugelassenen Servicestation gewartet wurde und der auf der Weste angegebene nächste Wartungstermin noch nicht überschritten ist.
