id: retro-reflective-material
drawing: retro-reflective-material
rules:
  - "4.18"
name:
  en: Marine retro-reflective material
  de: Seewasserfestes Reflexmaterial (Retro-Reflective Material)
applies:
  osr2:
    section: general
    order: 250
    pages:
      - 17
    cardHash: sha256:96eafeea6d00563dcafb4bdbdfa5e721cddcb438d16006f3190c6b3e21006695
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: Marine-grade retro-reflective material is material that reflects light back toward its source. The boat must have it on lifebuoys, recovery slings, liferafts and lifejackets; the rule specifies no quantity or dimensions.
      de: Hochseetaugliches retroreflektierendes Material wirft Licht zur Lichtquelle zurück. Es muss an Rettungsringen, Bergeschlaufen, Rettungsinseln und Rettungswesten angebracht sein; Menge und Abmessungen sind nicht festgelegt.
