id: doublehanded-mob-gnss
drawing: doublehanded-mob-gnss
rules:
  - 4.22.2
name:
  en: On-deck MOB GNSS for doublehanded crews
  de: MOB-Ortung an Deck für Zweiercrews (GNSS Crew Overboard Tracking)
applies:
  osr2:
    section: helm
    order: 20
    pages:
      - 19
    cardHash: sha256:ef1f045175ae91225cda9f9c147626eaf22dc924ce4c2879ba48848490103b1d
    sourceHash: sha256:41b43dfb746c4983958c2b9ae40cb4b42383b68acbc50faa6761853ea8ceb9f1
    explanation:
      en: Boats with only two crew members must carry a GNSS device that can record a man-overboard position within 10 seconds. The position must be monitorable without going below deck.
      de: Boote mit nur zwei Crewmitgliedern müssen ein GNSS-Gerät an Bord haben, das innerhalb von 10 Sekunden die Position eines Crewmitglieds über Bord erfassen kann. Die Position muss überwacht werden können, ohne unter Deck zu gehen.
