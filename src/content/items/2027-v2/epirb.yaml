id: epirb
drawing: epirb
rules:
  - 4.19.2
name:
  en: 406 MHz EPIRB with GNSS and AIS
  de: 406-MHz-Notfunkbake mit GNSS und AIS (EPIRB)
applies:
  osr2:
    section: helm
    order: 10
    pages:
      - 17
    cardHash: sha256:67e1e08e9ad348ad06810cf86e46e2a15c64318ec8e560aec014c4d514918156
    sourceHash: sha256:2944ac73b833a8482dad24a4619e48db0d67abc52c4e6a5fd3ef8f91e4afc411
    explanation:
      en: A 406 MHz EPIRB is an emergency beacon that sends a distress alert. It must be activatable both by water and manually, include internal GNSS, and, if registered after 2026, be able to transmit AIS.
      de: Ein 406-MHz-EPIRB ist ein Seenotfunkpeilsender. Er muss sowohl durch Wasserkontakt als auch manuell aktivierbar sein, über internes GNSS verfügen und bei einer Registrierung nach 2026 AIS senden können.
