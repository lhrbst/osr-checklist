id: cockpit-knife
drawing: cockpit-knife
rules:
  - "4.25"
name:
  en: Secured cockpit knife
  de: Gesichertes Cockpitmesser (Cockpit Knife)
applies:
  osr2:
    section: helm
    order: 80
    pages:
      - 20
    cardHash: sha256:d1363242a62abdb5caff770089220060656732149b44a54b7143c428d858ecf1
    sourceHash: sha256:47a4897c570a091b9eb2a520d90d99df380f0b77d2017921be9bdaedcaaab09d
    explanation:
      en: Carry a strong, sharp knife in a sheath that holds it securely in place. It must be readily accessible from the deck or cockpit; no size or rating is specified.
      de: Führen Sie ein stabiles, scharfes Messer in einer Scheide mit sicherer Halterung mit. Es muss vom Deck oder Cockpit aus schnell erreichbar sein; Größe oder Belastbarkeit sind nicht festgelegt.
